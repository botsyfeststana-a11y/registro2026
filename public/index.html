<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscripción a Competencias</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --border: #e2e8f0;
      --disabled: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 600px; background: var(--card-bg); padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    h1 { text-align: center; color: var(--primary); margin-bottom: 20px; font-size: 1.5rem; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.9rem; }
    input, select { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 1rem; outline: none; }
    input:focus, select:focus { border-color: var(--primary); }
    button { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 6px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s; margin-top: 10px; }
    button:hover { background: var(--primary-hover); }
    button:disabled { background: var(--disabled); cursor: not-allowed; }
    .status-msg { margin-top: 15px; padding: 12px; border-radius: 6px; font-size: 0.9rem; text-align: center; display: none; }
    .status-msg.success { background: #dcfce7; color: #166534; display: block; }
    .status-msg.error { background: #fee2e2; color: #991b1b; display: block; }
    .info-badge { font-size: 0.8rem; color: #64748b; margin-top: 4px; display: block; }
  </style>
</head>
<body>

<div class="container">
  <h1>Inscripción a Equipos</h1>
  
  <form id="registroForm">
    <div class="form-group">
      <label for="nombre">Nombre Completo *</label>
      <input type="text" id="nombre" required placeholder="Ej. Juan Pérez">
    </div>

    <div class="form-group">
      <label for="edad">Edad *</label>
      <input type="number" id="edad" required min="10" max="99" placeholder="Ej. 20">
    </div>

    <div class="form-group">
      <label for="whatsapp">WhatsApp *</label>
      <input type="tel" id="whatsapp" required placeholder="Ej. +5215512345678">
    </div>

    <div class="form-group">
      <label for="carrera">Nombre de Carrera *</label>
      <input type="text" id="carrera" required placeholder="Ej. Ingeniería en Sistemas">
    </div>

    <div class="form-group">
      <label for="competencia">Selecciona Competencia *</label>
      <select id="competencia" required>
        <option value="">-- Cargar competencias... --</option>
      </select>
    </div>

    <div class="form-group">
      <label for="equipo">Selecciona Equipo (Máximo 3 inscritos) *</label>
      <select id="equipo" required disabled>
        <option value="">-- Selecciona primero una competencia --</option>
      </select>
      <span class="info-badge">Los equipos que hayan alcanzado los 3 cupos no estarán disponibles.</span>
    </div>

    <button type="submit" id="btnSubmit">Completar Registro</button>
  </form>

  <div id="statusMsg" class="status-msg"></div>
</div>

<script>
  let competenciasData = [];

  const selectCompetencia = document.getElementById('competencia');
  const selectEquipo = document.getElementById('equipo');
  const form = document.getElementById('registroForm');
  const statusMsg = document.getElementById('statusMsg');
  const btnSubmit = document.getElementById('btnSubmit');

  // Cargar lista de competencias y equipos disponibles al inicio
  async function cargarCompetencias() {
    try {
      const res = await fetch('/api/competencias');
      competenciasData = await res.json();

      selectCompetencia.innerHTML = '<option value="">-- Selecciona una competencia --</option>';
      competenciasData.forEach(c => {
        selectCompetencia.innerHTML += `<option value="${c.id}">${c.nombre}</option>`;
      });
    } catch (err) {
      mostrarMensaje('Error al obtener la lista de competencias.', 'error');
    }
  }

  // Actualizar el selector de equipos según la competencia seleccionada
  selectCompetencia.addEventListener('change', (e) => {
    const compId = parseInt(e.target.value);
    const comp = competenciasData.find(c => c.id === compId);

    selectEquipo.innerHTML = '';
    selectEquipo.disabled = true;

    if (comp && comp.equipos.length > 0) {
      selectEquipo.disabled = false;
      selectEquipo.innerHTML = '<option value="">-- Selecciona un equipo --</option>';

      comp.equipos.forEach(eq => {
        const option = document.createElement('option');
        option.value = eq.id;
        
        if (eq.disponible) {
          option.textContent = `${eq.nombre} (${eq.total_inscritos}/3 inscritos)`;
        } else {
          option.textContent = `${eq.nombre} (LLENO - 3/3)`;
          option.disabled = true;
        }
        selectEquipo.appendChild(option);
      });
    } else {
      selectEquipo.innerHTML = '<option value="">-- Sin equipos disponibles --</option>';
    }
  });

  // Enviar el formulario al backend
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    btnSubmit.disabled = true;
    btnSubmit.textContent = 'Procesando...';

    const payload = {
      nombre_completo: document.getElementById('nombre').value,
      edad: parseInt(document.getElementById('edad').value),
      whatsapp: document.getElementById('whatsapp').value,
      carrera: document.getElementById('carrera').value,
      equipo_id: parseInt(selectEquipo.value)
    };

    try {
      const res = await fetch('/api/registro', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      const data = await res.json();

      if (res.ok) {
        mostrarMensaje('¡Registro completado con éxito!', 'success');
        form.reset();
        selectEquipo.disabled = true;
        cargarCompetencias(); // Recargar los conteos
      } else {
        mostrarMensaje(data.error || 'Ocurrió un error en el registro.', 'error');
      }
    } catch (err) {
      mostrarMensaje('Error de conexión con el servidor.', 'error');
    } finally {
      btnSubmit.disabled = false;
      btnSubmit.textContent = 'Completar Registro';
    }
  });

  function mostrarMensaje(texto, tipo) {
    statusMsg.textContent = texto;
    statusMsg.className = `status-msg ${tipo}`;
  }

  cargarCompetencias();
</script>

</body>
</html>
