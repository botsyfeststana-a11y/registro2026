<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscripción a Competencias</title>
  <style>
    :root { --primary: #2563eb; --bg: #f8fafc; --card: #ffffff; --text: #1e293b; --border: #cbd5e1; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; }
    .card { background: var(--card); padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
    h1 { text-align: center; color: var(--primary); margin-bottom: 20px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 0.9rem; }
    input, select { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 1rem; }
    button { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 6px; font-weight: 600; font-size: 1rem; cursor: pointer; margin-top: 10px; }
    button:hover { opacity: 0.9; }
  </style>
</head>
<body>

<div class="card">
  <h1>Inscripción</h1>
  <form id="registroForm">
    <div class="form-group">
      <label>Nombre Completo *</label>
      <input type="text" id="nombre" required placeholder="Ej. Juan Pérez">
    </div>

    <div class="form-group">
      <label>Edad *</label>
      <input type="number" id="edad" required placeholder="Ej. 20">
    </div>

    <div class="form-group">
      <label>WhatsApp *</label>
      <input type="tel" id="whatsapp" required placeholder="Ej. +5215512345678">
    </div>

    <div class="form-group">
      <label>Nombre de Carrera *</label>
      <input type="text" id="carrera" required placeholder="Ej. Ingeniería en Sistemas">
    </div>

    <div class="form-group">
      <label>Selecciona Competencia *</label>
      <select id="competencia" required>
        <option value="">Cargando competencias...</option>
      </select>
    </div>

    <button type="submit">Completar Registro</button>
  </form>
</div>

<script>
  // Cargar competencias y mostrar conteo de puestos restantes
  async function cargarCompetencias() {
    const selectComp = document.getElementById('competencia');
    
    // Mensaje informativo por si Render está reactivando el servidor tras inactividad
    selectComp.innerHTML = '<option value="">Despertando servidor... (puede tardar unos segundos)</option>';

    try {
      const res = await fetch('/api/competencias');
      const competencias = await res.json();
      
      selectComp.innerHTML = '<option value="">-- Selecciona una competencia --</option>';
      let competenciasDisponibles = 0;

      competencias.forEach(c => {
        // Solo mostrar competencias que tengan puestos disponibles
        if (!c.lleno) {
          competenciasDisponibles++;
          const textoCupos = c.cupos_restantes === 1 ? '1 puesto disponible' : `${c.cupos_restantes} puestos disponibles`;
          selectComp.innerHTML += `<option value="${c.id}">${c.nombre} (${textoCupos})</option>`;
        }
      });

      if (competenciasDisponibles === 0) {
        selectComp.innerHTML = '<option value="">No hay competencias con cupos disponibles</option>';
      }
    } catch (err) {
      selectComp.innerHTML = '<option value="">Error al cargar competencias. Intenta recargar la página.</option>';
    }
  }

  // Ejecutar la carga al abrir la página
  cargarCompetencias();

  // Guardar Registro
  document.getElementById('registroForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const data = {
      nombre: document.getElementById('nombre').value,
      edad: document.getElementById('edad').value,
      whatsapp: document.getElementById('whatsapp').value,
      carrera: document.getElementById('carrera').value,
      competencia_id: document.getElementById('competencia').value
    };

    const res = await fetch('/api/registro', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });

    const result = await res.json();
    alert(result.mensaje || result.error);

    if (res.ok) {
      document.getElementById('registroForm').reset();
      // Volver a cargar competencias para actualizar los puestos restantes en tiempo real
      cargarCompetencias();
    }
  });
</script>

</body>
</html>
