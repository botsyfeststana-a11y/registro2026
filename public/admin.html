<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Panel Administrador</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
    .hidden { display: none; }
    input, button { padding: 10px; margin: 5px 0; width: 100%; box-sizing: border-box; }
    button { background-color: #007bff; color: white; border: none; cursor: pointer; }
    button:hover { background-color: #0056b3; }
  </style>
</head>
<body>

  <!-- Vista de Login (Lo primero que debe verse) -->
  <div id="login-section">
    <h2>Acceso Administrador</h2>
    <p>Ingresa la contraseña configurada en Render:</p>
    <input type="password" id="adminPassword" placeholder="Contraseña de Administrador">
    <button onclick="login()">Ingresar al Panel</button>
    <p id="login-error" style="color: red;"></p>
  </div>

  <!-- Vista del Panel (Oculta hasta iniciar sesión) -->
  <div id="admin-panel" class="hidden">
    <h2>Panel de Control</h2>
    <button onclick="downloadExcel()">📥 Descargar Reporte en Excel (.xlsx)</button>
    <hr>
    <h3>Administración de Equipos</h3>
    <p>Aquí se gestionarán los cupos y competencias.</p>
  </div>

  <script>
    let savedPassword = '';

    function login() {
      const pwd = document.getElementById('adminPassword').value;
      if (!pwd) {
        document.getElementById('login-error').innerText = 'Por favor ingresa una contraseña.';
        return;
      }
      savedPassword = pwd;
      document.getElementById('login-section').classList.add('hidden');
      document.getElementById('admin-panel').classList.remove('hidden');
    }

    function downloadExcel() {
      window.location.href = `/api/export-excel?password=${encodeURIComponent(savedPassword)}`;
    }
  </script>
</body>
</html>
